name: release

# Tag a version (git tag v0.3.0 && git push --tags) and this attaches the
# frozen binaries to a GitHub release. The dashboard's "Check for updates"
# button reads that release.
#
# Order: CI on the tagged commit -> a draft release -> build, sign, smoke-test
# and upload every platform -> verify all assets against SHA256SUMS -> publish.
# Nothing is public (and nothing is offered to the updater) until every asset
# and the checksum file are there.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG"

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: lumen.exe
            built: dist/lumen.exe
          - os: macos-15
            asset: lumen-macos
            built: dist/lumen
          - os: macos-15-intel
            asset: lumen-macos-x86_64
            built: dist/lumen
          - os: ubuntu-latest
            asset: lumen-linux
            built: dist/lumen
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pyinstaller build/lumen.spec --distpath dist --workpath build/pyi -y
      - name: Sign the binary (only when signing secrets are configured)
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # See docs/packaging/SIGNING.md. Without secrets this step is a no-op,
          # so forks and unsigned releases keep working.
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MACOS_CERT_P12" ]; then
            echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
            security create-keychain -p tmp build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p tmp build.keychain
            security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k tmp build.keychain
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "${{ matrix.built }}"
            ditto -c -k --keepParent "${{ matrix.built }}" notarize.zip
            xcrun notarytool submit notarize.zip --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WINDOWS_CERT_PFX" ]; then
            echo "$WINDOWS_CERT_PFX" | base64 --decode > cert.pfx
            SIGNTOOL=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | tail -1)
            "$SIGNTOOL" sign /f cert.pfx /p "$WINDOWS_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ matrix.built }}"
          else
            echo "no signing secrets for $RUNNER_OS; shipping unsigned"
          fi
      # Run the binary we are about to ship, after signing, so the bytes tested
      # are the bytes uploaded. A hidden import PyInstaller missed fails here
      # instead of on a user's machine. The Windows build is windowed, so only
      # its exit code speaks.
      - name: Smoke-test the frozen binary
        shell: bash
        run: |
          chmod +x "${{ matrix.built }}" 2>/dev/null || true
          "${{ matrix.built }}" selfcheck
          "${{ matrix.built }}" scan
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb >/dev/null
            xvfb-run -a python tests/smoke_notch_child.py "${{ matrix.built }}"
          else
            python tests/smoke_notch_child.py "${{ matrix.built }}"
          fi
        env:
          LUMEN_HOME: ${{ runner.temp }}/lumen-home
      - name: Name the binary after the platform, record its checksum, upload to the draft
        shell: bash
        run: |
          mv "${{ matrix.built }}" "${{ matrix.asset }}"
          # The runners disagree about which checksum tool exists: Linux and
          # Git Bash on Windows have sha256sum, macOS has shasum.
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"
          gh release upload "$TAG" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify every asset against its checksum, then publish once
        run: |
          mkdir release && cd release
          gh release download "$TAG"
          for asset in lumen.exe lumen-macos lumen-macos-x86_64 lumen-linux; do
            test -s "$asset" && test -s "$asset.sha256" || { echo "missing $asset"; exit 1; }
          done
          # The in-app updater refuses anything whose SHA-256 is not listed here.
          cat *.sha256 | sed 's/ \*/  /' > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest

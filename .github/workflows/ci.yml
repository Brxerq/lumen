name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tests and linters read the checkout and nothing else. Without this the
# workflow token inherits whatever the repository's default happens to be.
permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # An editable install puts the console scripts on PATH, so `pytest` and
      # `lumen` below are the ones from this checkout.
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: lumen scan
        env:
          LUMEN_HOME: ${{ runner.temp }}/lumen-home
      # Every adapter and integration imports, and the status tab draws a frame
      # without a display: the checks a frozen build must pass too (release.yml).
      - run: lumen selfcheck
        env:
          LUMEN_HOME: ${{ runner.temp }}/lumen-home

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests        # rules live in pyproject.toml
      - run: node --check src/lumen/server/ui/app.js
      - run: node tests/dashboard_smoke.cjs
      - run: pyright                     # scope lives in pyrightconfig.json
      # Not `python -m build`: this repository has a top-level build/ directory
      # (the PyInstaller spec lives there), and with the repo root on sys.path it
      # shadows the build package. The console script has no such problem.
      - run: pyproject-build             # the sdist and wheel still assemble
